<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频作品集</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </span>
        视频作品集
      </a>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="search" type="search" placeholder="搜索视频" autocomplete="off">
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1><span class="grad" style="width: 105.948px; height: 72.4528px;">作品</span></h1>
      <p>一个极简的视频作品集画廊 —— 悬停可预览，点击即可播放。</p>
    </section>

    <div class="toolbar">
      <div class="filters" id="filters"><button class="chip active" data-cat="全部">全部</button><button class="chip" data-cat="我的视频">我的视频</button></div>
      <span class="result-count" id="result-count">6 个视频</span>
    </div>

    <section class="grid" id="grid">
    <article class="card" data-id="soda-candy" style="animation-delay:0ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/dolldamage - soda candy 120.mp4#t=0.1" src="videos/dolldamage - soda candy 120.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:13</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>dolldamage - soda candy ₊˚⊹</h3>
        <p></p>
      </div>
    </article>
    <article class="card" data-id="naoi-rei" style="animation-delay:60ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/NAOI REI.mp4#t=0.1" src="videos/NAOI REI.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:18</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>NAOI REI</h3>
        <p></p>
      </div>
    </article>
    <article class="card" data-id="rei-world" style="animation-delay:120ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/rei world.mp4#t=0.1" src="videos/rei world.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:14</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>rei world</h3>
        <p></p>
      </div>
    </article>
    <article class="card" data-id="reiyomi" style="animation-delay:180ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/reiyomi.mp4#t=0.1" src="videos/reiyomi.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:13</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>reiyomi</h3>
        <p></p>
      </div>
    </article>
    <article class="card" data-id="ribbon" style="animation-delay:240ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/🎀.mp4#t=0.1" src="videos/🎀.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:20</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>🎀</h3>
        <p></p>
      </div>
    </article>
    <article class="card" data-id="heart" style="animation-delay:300ms">
      <div class="thumb">
        <video muted="" loop="" playsinline="" preload="metadata" data-src="videos/🩷.mp4#t=0.1" src="videos/🩷.mp4#t=0.1"></video>
        <div class="play-badge">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </div>
        <span class="duration">0:16</span>
      </div>
      <div class="card-body">
        <span class="tag">我的视频</span>
        <h3>🩷</h3>
        <p></p>
      </div>
    </article></section>

    <div class="empty" id="empty" hidden="">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="M10 9.5v5l4.5-2.5z"></path></svg>
      <p>没有找到匹配的视频</p>
      <button class="empty-reset" id="empty-reset">清除筛选</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>视频作品集 · 本地视频画廊</p>
  </footer>

  <div class="modal" id="modal" hidden="">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div class="modal-video-wrap">
        <video id="modal-video" controls="" playsinline=""></video>
      </div>
      <div class="modal-info">
        <span class="tag" id="modal-tag"></span>
        <h2 id="modal-title"></h2>
        <p id="modal-desc"></p>
      </div>
    </div>
  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/main.js?v=3"></script>


</body></html>
